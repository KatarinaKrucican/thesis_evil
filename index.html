<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evil Iframe Login</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background-color: #fee; margin: 0; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #d9534f; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h3>Embedded Login Form</h3>
    <form action="#stolen">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <label for="totp">Authenticator Code</label>
        <input type="text" id="totp" name="totp" autocomplete="one-time-code" inputmode="numeric" required>

        <button type="submit">Log In</button>
    </form>
</body>
</html>
